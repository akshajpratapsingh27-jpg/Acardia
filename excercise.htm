<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Move</title>
<style>
  :root{
    --ink:#101820;
    --paper:#F4EFE6;
    --paper2:#EAE3D4;
    --orange:#FF5A36;
    --stone:#C9C2B4;
    --moss:#2E7D6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    max-width:420px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    overflow:hidden;
  }

  /* ============ HOME SCREEN ============ */
  .home{padding:28px 20px 40px;}
  .home-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:22px;
  }
  .home-top h1{
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;
    margin:0;
    font-stretch:condensed;
    line-height:.92;
  }
  .home-top span{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#6b6559;
    margin-top:6px;
  }
  .streak{
    text-align:right;
    font-size:13px;
    font-weight:700;
    color:var(--orange);
  }
  .streak b{display:block;font-size:26px;color:var(--ink);}

  .continue-tile{
    background:var(--ink);
    color:var(--paper);
    border-radius:22px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:26px;
    cursor:pointer;
    border:none;
    width:100%;
    text-align:left;
  }
  .continue-tile .glyph{
    width:56px;height:56px;flex:none;
    border-radius:16px;
    background:var(--orange);
    display:flex;align-items:center;justify-content:center;
  }
  .continue-tile .glyph svg{width:34px;height:34px;}
  .continue-tile .meta{flex:1;}
  .continue-tile .meta .label{font-size:11px;letter-spacing:.5px;color:var(--stone);font-weight:700;text-transform:uppercase;}
  .continue-tile .meta .name{font-size:20px;font-weight:800;margin-top:2px;}
  .continue-tile .arrow{font-size:20px;color:var(--orange);}

  .section-label{
    font-size:13px;
    font-weight:700;
    color:#6b6559;
    margin:0 0 12px 2px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .tile{
    background:var(--paper2);
    border:none;
    border-radius:18px;
    padding:16px 14px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:20px;
    transition:transform .15s ease, background .2s ease;
    position:relative;
  }
  .tile:active{transform:scale(.96);}
  .tile .glyph{
    width:38px;height:38px;
    color:var(--ink);
  }
  .tile .glyph svg{width:100%;height:100%;}
  .tile .tname{font-size:16px;font-weight:800;line-height:1.15;}
  .tile .ttag{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--moss);
    margin-top:-14px;
  }
  .tile.low .ttag{color:var(--moss);}
  .tile.high .ttag{color:var(--orange);}

  /* ============ PLAYER SCREEN ============ */
  .player{
    position:absolute;
    inset:0;
    background:var(--ink);
    color:var(--paper);
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .38s cubic-bezier(.22,1,.36,1);
  }
  .player.open{transform:translateX(0);}

  .player-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 20px 10px;
  }
  .back-btn{
    background:none;border:none;color:var(--paper);
    font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;
    padding:8px 4px;
  }
  .ex-tag{
    font-size:11px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--orange);
  }

  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 20px;
  }
  .stage-figure{width:100%; max-width:280px;}

  .ex-name{
    font-size:28px;
    font-weight:900;
    letter-spacing:-.5px;
    text-align:center;
    margin:0 20px 6px;
  }
  .ex-caption{
    text-align:center;
    font-size:14px;
    color:var(--stone);
    margin:0 30px 22px;
    line-height:1.4;
  }

  .rep-row{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
  }
  .rep-row .rep-dot{
    width:8px;height:8px;border-radius:50%;
    background:#3a4148;
  }
  .rep-row .rep-dot.done{background:var(--orange);}

  .player-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:16px 20px 34px;
  }
  .pc-btn{
    background:#1b242c;
    border:none;
    color:var(--paper);
    width:52px;height:52px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .pc-btn.main{
    background:var(--orange);
    color:var(--ink);
    width:68px;height:68px;
    font-size:20px;
  }
  .pc-btn:active{transform:scale(.92);}

  /* ============ STICK FIGURE (shared skeleton) ============ */
  .fig-svg{overflow:visible;}
  .limb{stroke:var(--paper); stroke-width:7; stroke-linecap:round; fill:none;}
  .head{fill:var(--paper);}
  .accent{stroke:var(--orange);}

  /* joint groups use transform-origin set inline per exercise via CSS below */

  /* ---------- Jumping Jacks ---------- */
  .anim-jumpingjacks .armL{ animation: jj-armL 1.1s ease-in-out infinite; transform-origin:100px 78px; }
  .anim-jumpingjacks .armR{ animation: jj-armR 1.1s ease-in-out infinite; transform-origin:140px 78px; }
  .anim-jumpingjacks .legL{ animation: jj-legL 1.1s ease-in-out infinite; transform-origin:120px 150px; }
  .anim-jumpingjacks .legR{ animation: jj-legR 1.1s ease-in-out infinite; transform-origin:120px 150px; }
  .anim-jumpingjacks .body{ animation: jj-body 1.1s ease-in-out infinite; }
  @keyframes jj-armL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-150deg);}}
  @keyframes jj-armR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(150deg);}}
  @keyframes jj-legL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-24deg);}}
  @keyframes jj-legR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(24deg);}}
  @keyframes jj-body{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  /* ---------- Squats ---------- */
  .anim-squats .body{ animation: sq-body 1.6s ease-in-out infinite; transform-origin:120px 150px; }
  .anim-squats .thighL{ animation: sq-thighL 1.6s ease-in-out infinite; transform-origin:112px 150px;}
  .anim-squats .thighR{ animation: sq-thighR 1.6s ease-in-out infinite; transform-origin:128px 150px;}
  .anim-squats .shinL{ animation: sq-shinL 1.6s ease-in-out infinite; transform-origin:112px 178px;}
  .anim-squats .shinR{ animation: sq-shinR 1.6s ease-in-out infinite; transform-origin:128px 178px;}
  .anim-squats .armL{ animation: sq-armL 1.6s ease-in-out infinite; transform-origin:100px 78px;}
  .anim-squats .armR{ animation: sq-armR 1.6s ease-in-out infinite; transform-origin:140px 78px;}
  @keyframes sq-body{0%,100%{transform:translateY(0);}50%{transform:translateY(30px);}}
  @keyframes sq-thighL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-40deg);}}
  @keyframes sq-thighR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(40deg);}}
  @keyframes sq-shinL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(55deg);}}
  @keyframes sq-shinR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-55deg);}}
  @keyframes sq-armL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-70deg);}}
  @keyframes sq-armR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(70deg);}}

  /* ---------- Lunges ---------- */
  .anim-lunges .body{ animation: lg-body 1.7s ease-in-out infinite; transform-origin:120px 150px;}
  .anim-lunges .thighL{ animation: lg-thighL 1.7s ease-in-out infinite; transform-origin:112px 150px;}
  .anim-lunges .shinL{ animation: lg-shinL 1.7s ease-in-out infinite; transform-origin:112px 178px;}
  .anim-lunges .thighR{ animation: lg-thighR 1.7s ease-in-out infinite; transform-origin:128px 150px;}
  .anim-lunges .shinR{ animation: lg-shinR 1.7s ease-in-out infinite; transform-origin:128px 178px;}
  @keyframes lg-body{0%,100%{transform:translateY(0);}50%{transform:translateY(20px) translateX(6px);}}
  @keyframes lg-thighL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-55deg);}}
  @keyframes lg-shinL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(70deg);}}
  @keyframes lg-thighR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(35deg);}}
  @keyframes lg-shinR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-70deg);}}

  /* ---------- Push-Ups (viewed from side, simplified) ---------- */
  .anim-pushups .body{ animation: pu-body 1.4s ease-in-out infinite; transform-origin:170px 150px;}
  .anim-pushups .armL{ animation: pu-armL 1.4s ease-in-out infinite; transform-origin:100px 110px;}
  .anim-pushups .armR{ animation: pu-armR 1.4s ease-in-out infinite; transform-origin:100px 110px;}
  @keyframes pu-body{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(14px) rotate(-4deg);}}
  @keyframes pu-armL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(35deg);}}
  @keyframes pu-armR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(35deg);}}

  /* ---------- Arm Circles ---------- */
  .anim-armcircles .armL{ animation: ac-armL 1.8s linear infinite; transform-origin:100px 78px;}
  .anim-armcircles .armR{ animation: ac-armR 1.8s linear infinite; transform-origin:140px 78px;}
  @keyframes ac-armL{ from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
  @keyframes ac-armR{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* ---------- High Knees ---------- */
  .anim-highknees .thighL{ animation: hk-thighL .8s ease-in-out infinite; transform-origin:112px 150px;}
  .anim-highknees .shinL{ animation: hk-shinL .8s ease-in-out infinite; transform-origin:112px 178px;}
  .anim-highknees .thighR{ animation: hk-thighR .8s ease-in-out infinite .4s; transform-origin:128px 150px;}
  .anim-highknees .shinR{ animation: hk-shinR .8s ease-in-out infinite .4s; transform-origin:128px 178px;}
  .anim-highknees .armL{ animation: hk-armL .8s ease-in-out infinite .4s; transform-origin:100px 78px;}
  .anim-highknees .armR{ animation: hk-armR .8s ease-in-out infinite; transform-origin:140px 78px;}
  .anim-highknees .body{ animation: hk-body .8s ease-in-out infinite; }
  @keyframes hk-thighL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-100deg);}}
  @keyframes hk-shinL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(90deg);}}
  @keyframes hk-thighR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-100deg);}}
  @keyframes hk-shinR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(90deg);}}
  @keyframes hk-armL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(60deg);}}
  @keyframes hk-armR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-60deg);}}
  @keyframes hk-body{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  @media (prefers-reduced-motion: reduce){
    .anim-jumpingjacks *,.anim-squats *,.anim-lunges *,.anim-pushups *,.anim-armcircles *,.anim-highknees *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===================== HOME ===================== -->
  <div class="home" id="homeScreen">
    <div class="home-top">
      <div>
        <h1>Move</h1>
        <span>Pick something to work on</span>
      </div>
      <div class="streak">Streak<b>4</b></div>
    </div>

    <button class="continue-tile" id="continueTile">
      <div class="glyph">
        <svg viewBox="0 0 24 24" fill="none" stroke="#101820" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 8v6M12 10l-4 2M12 10l4 2M12 14l-3 6M12 14l3 6"/></svg>
      </div>
      <div class="meta">
        <div class="label">Continue</div>
        <div class="name">Jumping Jacks</div>
      </div>
      <div class="arrow">→</div>
    </button>

    <div class="section-label">All exercises</div>
    <div class="grid" id="exerciseGrid"></div>
  </div>

  <!-- ===================== PLAYER ===================== -->
  <div class="player" id="player">
    <div class="player-top">
      <button class="back-btn" id="backBtn">← Home</button>
      <div class="ex-tag" id="exTag">Full Body</div>
    </div>

    <div class="stage">
      <svg class="stage-figure fig-svg" id="figureSvg" viewBox="20 20 200 210">
        <g class="body">
          <circle class="head" cx="120" cy="55" r="16"/>
          <line class="limb" x1="120" y1="71" x2="120" y2="150"/>
          <g class="armL"><line class="limb" x1="100" y1="78" x2="70" y2="110"/></g>
          <g class="armR"><line class="limb" x1="140" y1="78" x2="170" y2="110"/></g>
          <g class="thighL"><line class="limb" x1="112" y1="150" x2="112" y2="178"/>
            <g class="shinL"><line class="limb" x1="112" y1="178" x2="112" y2="212"/></g>
          </g>
          <g class="thighR"><line class="limb" x1="128" y1="150" x2="128" y2="178"/>
            <g class="shinR"><line class="limb" x1="128" y1="178" x2="128" y2="212"/></g>
          </g>
          <g class="legL"><line class="limb accent" x1="120" y1="150" x2="120" y2="212"/></g>
          <g class="legR"><line class="limb accent" x1="120" y1="150" x2="120" y2="212" style="display:none"/></g>
        </g>
      </svg>
    </div>

    <h2 class="ex-name" id="exName">Jumping Jacks</h2>
    <p class="ex-caption" id="exCaption">Jump your feet out while raising both arms overhead, then snap back to start.</p>

    <div class="rep-row" id="repRow"></div>

    <div class="player-controls">
      <button class="pc-btn" id="prevBtn" aria-label="Previous exercise">←</button>
      <button class="pc-btn main" id="pauseBtn" aria-label="Pause">❚❚</button>
      <button class="pc-btn" id="nextBtn" aria-label="Next exercise">→</button>
    </div>
  </div>

</div>

<script>
const EXERCISES = [
  {
    id:'jumpingjacks', name:'Jumping Jacks', tag:'Cardio', intensity:'high',
    caption:'Jump your feet out while raising both arms overhead, then snap back to start.',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 8v6M12 10l-6 -3M12 10l6 -3M12 14l-4 6M12 14l4 6"/></svg>`,
    dur:20
  },
  {
    id:'squats', name:'Squats', tag:'Lower Body', intensity:'high',
    caption:'Push your hips back and bend your knees like sitting into a chair, then drive back up.',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="4" r="2"/><path d="M12 7v4M12 11l-4 2M12 11l4 2M12 11l-2 7h4l-2-7"/></svg>`,
    dur:20
  },
  {
    id:'lunges', name:'Lunges', tag:'Lower Body', intensity:'low',
    caption:'Step one leg forward and lower until both knees form right angles. Alternate sides.',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="4" r="2"/><path d="M10 7v4M10 11l-3 2M10 11l4 3M7 13l-1 6M14 14l3 6"/></svg>`,
    dur:20
  },
  {
    id:'pushups', name:'Push-Ups', tag:'Upper Body', intensity:'high',
    caption:'Lower your chest toward the floor by bending your elbows, then press back up.',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="9" r="2"/><path d="M5 11l14 5M8 12l-2 5M12 13.4l-1 5M19 16l1 4"/></svg>`,
    dur:20
  },
  {
    id:'armcircles', name:'Arm Circles', tag:'Warm-Up', intensity:'low',
    caption:'Extend your arms out to the sides and sweep them in slow, steady circles.',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 8v10"/><circle cx="6" cy="10" r="3"/><circle cx="18" cy="10" r="3"/></svg>`,
    dur:15
  },
  {
    id:'highknees', name:'High Knees', tag:'Cardio', intensity:'high',
    caption:'Jog in place, driving your knees up toward your chest as fast as you can.',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="4" r="2"/><path d="M12 7v3M12 10l-5 -1M12 10l4 3M7 9l-2 5M16 13l1 6"/></svg>`,
    dur:20
  }
];

const grid = document.getElementById('exerciseGrid');
EXERCISES.forEach(ex=>{
  const btn = document.createElement('button');
  btn.className = 'tile ' + ex.intensity;
  btn.innerHTML = `<div class="glyph">${ex.icon}</div><div><div class="tname">${ex.name}</div><div class="ttag">${ex.tag}</div></div>`;
  btn.addEventListener('click', ()=>openPlayer(ex.id));
  grid.appendChild(btn);
});
document.getElementById('continueTile').addEventListener('click', ()=>openPlayer('jumpingjacks'));

const player = document.getElementById('player');
const figureSvg = document.getElementById('figureSvg');
const exName = document.getElementById('exName');
const exCaption = document.getElementById('exCaption');
const exTag = document.getElementById('exTag');
const repRow = document.getElementById('repRow');
const pauseBtn = document.getElementById('pauseBtn');

let currentIndex = 0;
let playing = true;
let repTimer = null;
let repCount = 0;

function openPlayer(id){
  currentIndex = EXERCISES.findIndex(e=>e.id===id);
  renderExercise();
  player.classList.add('open');
}
function closePlayer(){
  player.classList.remove('open');
  clearInterval(repTimer);
}

function renderExercise(){
  const ex = EXERCISES[currentIndex];
  figureSvg.className.baseVal = 'stage-figure fig-svg anim-' + ex.id;
  exName.textContent = ex.name;
  exCaption.textContent = ex.caption;
  exTag.textContent = ex.tag;

  repRow.innerHTML = '';
  const totalReps = 8;
  for(let i=0;i<totalReps;i++){
    const d = document.createElement('div');
    d.className = 'rep-dot';
    repRow.appendChild(d);
  }
  repCount = 0;
  clearInterval(repTimer);
  playing = true;
  pauseBtn.textContent = '❚❚';
  repTimer = setInterval(()=>{
    if(!playing) return;
    const dots = repRow.querySelectorAll('.rep-dot');
    if(repCount < dots.length){
      dots[repCount].classList.add('done');
      repCount++;
    } else {
      repCount = 0;
      dots.forEach(d=>d.classList.remove('done'));
    }
  }, 900);
}

pauseBtn.addEventListener('click', ()=>{
  playing = !playing;
  pauseBtn.textContent = playing ? '❚❚' : '▶';
  figureSvg.style.animationPlayState = playing ? 'running' : 'paused';
  figureSvg.querySelectorAll('*').forEach(el=>{
    el.style.animationPlayState = playing ? 'running' : 'paused';
  });
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  currentIndex = (currentIndex+1) % EXERCISES.length;
  renderExercise();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  currentIndex = (currentIndex-1+EXERCISES.length) % EXERCISES.length;
  renderExercise();
});
document.getElementById('backBtn').addEventListener('click', closePlayer);
</script>
</body>
</html>
